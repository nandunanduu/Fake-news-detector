<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #080b14;
      --surface:  #0d1117;
      --surface2: #111827;
      --border:   rgba(99,116,143,.22);
      --accent:   #00d4ff;
      --accent2:  #6366f1;
      --accent3:  #a855f7;
      --fake:     #ef4444;
      --real:     #10b981;
      --text:     #e2e8f0;
      --muted:    #6b7a99;
      --dim:      #334155;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 3px; }

    /* ── Layout ── */
    .container { max-width: 820px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Animations ── */
    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes glowPulse {
      0%,100% { filter: drop-shadow(0 0 12px rgba(0,212,255,.45)) drop-shadow(0 0 28px rgba(99,102,241,.25)); }
      50%      { filter: drop-shadow(0 0 22px rgba(0,212,255,.75)) drop-shadow(0 0 48px rgba(99,102,241,.45)); }
    }
    @keyframes scanLine {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes verdictIn { from { opacity:0; transform:scale(.96) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hero ── */
    .hero { text-align: center; padding: 52px 0 36px; }
    .hero-title {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(1.8rem, 6vw, 3.4rem);
      background: linear-gradient(270deg, #00d4ff, #6366f1, #a855f7, #00d4ff);
      background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: gradientShift 5s ease infinite, glowPulse 3s ease-in-out infinite;
      line-height: 1.1; position: relative; overflow: hidden; display: inline-block;
    }
    .hero-title::after {
      content: ''; position: absolute; top: 0; left: 0; width: 25%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
      animation: scanLine 3.5s ease-in-out infinite;
    }
    .hero-sub { font-family: 'Space Grotesk', sans-serif; color: var(--muted); margin-top: 12px; font-size: 1rem; }
    .hero-sub span { color: var(--accent); font-weight: 600; }
    .hero-divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; margin: 14px auto 0; }

    /* ── Card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; margin-bottom: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      animation: fadeIn .5s ease both;
    }

    /* ── Model selector ── */
    .model-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .model-btn {
      flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-size: .88rem;
      font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: .5px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
      transition: all .2s;
    }
    .model-btn.active { background: var(--surface2); border-color: var(--accent2); color: var(--accent2); }
    .model-btn:hover:not(.active) { border-color: var(--dim); color: var(--text); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
    .tab-btn {
      padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: .88rem;
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      transition: all .2s;
    }
    .tab-btn.active { background: rgba(99,102,241,.15); border-color: var(--accent2); color: var(--accent2); }
    .tab-btn:hover:not(.active) { border-color: var(--dim); color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Labels ── */
    .field-label {
      font-size: .75rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px; display: block;
    }

    /* ── Textarea ── */
    .textarea-wrap { position: relative; }
    textarea {
      width: 100%; height: 190px; padding: 14px 16px;
      background: #0a0f1a; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: .95rem;
      resize: vertical; transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.12); }
    textarea::placeholder { color: var(--dim); }
    .clear-btn {
      position: absolute; top: 10px; right: 10px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 4px 10px; font-size: .78rem; cursor: pointer;
      transition: all .2s; font-family: 'Inter', sans-serif;
    }
    .clear-btn:hover { border-color: var(--dim); color: var(--text); }

    /* ── URL input row ── */
    .url-row { display: flex; gap: 10px; }
    .url-row input {
      flex: 1; padding: 12px 14px;
      background: #0a0f1a; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: .95rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .url-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.12); }
    .url-row input::placeholder { color: var(--dim); }

    /* ── URL meta card ── */
    .url-meta {
      background: var(--surface2); border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0; padding: 12px 16px; margin-top: 12px;
      font-size: .88rem; animation: fadeIn .3s ease;
    }
    .url-meta strong { color: var(--accent); display: block; margin-bottom: 4px; }
    .url-meta .url-stats { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    .url-preview {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-top: 10px; font-size: .83rem; color: var(--muted);
      max-height: 100px; overflow-y: auto; white-space: pre-wrap; display: none;
    }
    .toggle-preview { color: var(--accent2); cursor: pointer; font-size: .8rem; margin-top: 6px; display: inline-block; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 15px; margin-top: 16px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      font-size: 1rem; letter-spacing: .5px;
      transition: all .2s; box-shadow: 0 4px 15px rgba(14,165,233,.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(14,165,233,.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-secondary {
      padding: 8px 16px; background: transparent;
      border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
      cursor: pointer; font-size: .85rem; transition: all .2s; font-family: 'Inter', sans-serif;
    }
    .btn-secondary:hover { border-color: var(--dim); color: var(--text); }

    /* ── Spinner ── */
    .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }

    /* ── Result section ── */
    #result { display: none; }
    .verdict-fake {
      background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 50%, #991b1b 100%);
      border: 1px solid rgba(239,68,68,.5); border-radius: 14px;
      padding: 22px 28px; text-align: center; color: #fff;
      font-family: 'Orbitron', sans-serif; font-size: clamp(1.1rem,3vw,1.6rem);
      font-weight: 700; letter-spacing: 2px;
      box-shadow: 0 0 40px rgba(220,38,38,.35);
      animation: verdictIn .4s ease both;
    }
    .verdict-real {
      background: linear-gradient(135deg, #064e3b 0%, #059669 50%, #065f46 100%);
      border: 1px solid rgba(16,185,129,.5); border-radius: 14px;
      padding: 22px 28px; text-align: center; color: #fff;
      font-family: 'Orbitron', sans-serif; font-size: clamp(1.1rem,3vw,1.6rem);
      font-weight: 700; letter-spacing: 2px;
      box-shadow: 0 0 40px rgba(16,185,129,.35);
      animation: verdictIn .4s ease both;
    }

    /* ── Probability row ── */
    .prob-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .prob-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; text-align: center; animation: fadeIn .5s .1s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .prob-value { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 700; }
    .prob-value.fake { color: var(--fake); }
    .prob-value.real { color: var(--real); }
    .prob-label { font-size: .75rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
    .progress-bar { height: 5px; border-radius: 3px; margin-top: 8px; overflow: hidden; background: var(--surface2); }
    .progress-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }
    .progress-fill.fake { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .progress-fill.real { background: linear-gradient(90deg, #059669, #10b981); }

    /* ── Word chart ── */
    .section-header {
      font-family: 'Space Grotesk', sans-serif; font-size: .95rem; font-weight: 600;
      color: var(--muted); margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .section-header::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

    .word-chart { display: flex; flex-direction: column; gap: 6px; }
    .word-bar-row { display: flex; align-items: center; gap: 8px; font-size: .82rem; animation: fadeIn .3s ease both; }
    .word-label { width: 120px; text-align: right; color: var(--muted); font-family: 'monospace', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .word-bar-track { flex: 1; height: 18px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
    .word-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
    .word-bar-fill.fake { background: linear-gradient(90deg, #991b1b, #ef4444); }
    .word-bar-fill.real { background: linear-gradient(90deg, #065f46, #10b981); }
    .word-direction { font-size: .7rem; font-weight: 600; letter-spacing: .5px; width: 38px; }
    .word-direction.fake { color: var(--fake); }
    .word-direction.real { color: var(--real); }

    /* ── History ── */
    .history-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .history-content { display: none; margin-top: 16px; }
    .history-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
      padding: 10px 12px; border-radius: 8px; background: var(--surface2);
      border: 1px solid var(--border); margin-bottom: 8px; font-size: .84rem;
    }
    .history-row .h-text { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-row .h-badge { padding: 2px 10px; border-radius: 12px; font-size: .72rem; font-weight: 700; letter-spacing: .5px; }
    .h-badge.fake { background: rgba(239,68,68,.15); color: var(--fake); }
    .h-badge.real { background: rgba(16,185,129,.15); color: var(--real); }
    .history-row .h-conf { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .history-empty { text-align: center; color: var(--dim); padding: 20px; font-size: .9rem; }

    /* ── Error / info messages ── */
    .msg-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); border-radius: 8px; padding: 12px 16px; color: #fca5a5; font-size: .9rem; margin-top: 12px; display: none; }
    .msg-info  { background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.2);  border-radius: 8px; padding: 12px 16px; color: #67e8f9; font-size: .9rem; margin-top: 12px; display: none; }

    /* ── Chevron ── */
    .chevron { transition: transform .25s; }
    .chevron.open { transform: rotate(180deg); }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .prob-row { grid-template-columns: 1fr; }
      .word-label { width: 80px; }
      .model-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ── Hero ──────────────────────────────────────────────────── -->
  <div class="hero">
    <h1 class="hero-title">FAKE NEWS DETECTOR</h1>
    <p class="hero-sub">AI-Powered · Detect <span>misinformation</span> instantly</p>
    <div class="hero-divider"></div>
  </div>

  <!-- ── Main card ─────────────────────────────────────────────── -->
  <div class="card">

    <!-- Model selector -->
    <span class="field-label">Model</span>
    <div class="model-row" id="modelRow">
      <button class="model-btn active" data-model="logistic_regression">Logistic Regression</button>
      <button class="model-btn" data-model="naive_bayes">Naive Bayes</button>
    </div>

    <!-- Input tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="paste">✏️ Type / Paste</button>
      <button class="tab-btn" data-tab="url">🔗 Enter URL</button>
      <button class="tab-btn" data-tab="file">📂 Upload .txt</button>
    </div>

    <!-- Tab: Paste -->
    <div class="tab-panel active" id="tab-paste">
      <span class="field-label">News Article Text</span>
      <div class="textarea-wrap">
        <textarea id="newsText" placeholder="Paste a news headline or full article here …"></textarea>
        <button class="clear-btn" onclick="clearAll()">✕ Clear</button>
      </div>
    </div>

    <!-- Tab: URL -->
    <div class="tab-panel" id="tab-url">
      <span class="field-label">News Article URL</span>
      <div class="url-row">
        <input type="url" id="urlInput" placeholder="https://www.example.com/news/article"/>
        <button class="btn-secondary" id="fetchBtn" onclick="fetchURL()">⬇ Fetch</button>
      </div>
      <div id="urlMeta" class="url-meta" style="display:none">
        <strong id="urlTitle"></strong>
        <div class="url-stats" id="urlStats"></div>
        <span class="toggle-preview" onclick="togglePreview()">▶ Show preview</span>
        <div class="url-preview" id="urlPreview"></div>
      </div>
      <div class="msg-error" id="urlError"></div>
    </div>

    <!-- Tab: File -->
    <div class="tab-panel" id="tab-file">
      <span class="field-label">Upload plain-text file (.txt)</span>
      <input type="file" id="fileInput" accept=".txt" style="color:var(--muted);width:100%;padding:10px 0"
             onchange="handleFile(event)"/>
      <div id="filePreview" class="url-preview" style="display:none;max-height:140px;margin-top:10px"></div>
    </div>

    <!-- Analyse button -->
    <button class="btn-primary" id="analyseBtn" onclick="analyse()">
      <span id="btnText">🔬 Analyse Article</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="msg-error" id="analyseError"></div>
  </div>

  <!-- ── Result card ───────────────────────────────────────────── -->
  <div id="result">
    <div id="verdictBanner"></div>
    <div class="prob-row" id="probRow"></div>

    <div class="section-header">🔑 Key Words Influencing This Prediction</div>
    <div class="card" style="padding:18px">
      <div class="word-chart" id="wordChart"></div>
    </div>
  </div>

  <!-- ── History card ──────────────────────────────────────────── -->
  <div class="card" style="margin-top:8px">
    <div class="history-toggle" onclick="toggleHistory()">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;color:var(--muted)">
        📋 Prediction History
      </span>
      <svg class="chevron" id="histChevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="history-content" id="historyContent">
      <div id="historyList"><div class="history-empty">No predictions yet.</div></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn-secondary" onclick="loadHistory()" style="flex:1">↻ Refresh</button>
        <button class="btn-secondary" onclick="clearHistoryAll()" style="flex:1;color:#f87171;border-color:rgba(239,68,68,.3)">🗑 Clear All</button>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
// ── State ────────────────────────────────────────────────────────────────
let activeModel = 'logistic_regression';
let activeTab   = 'paste';
let urlFetched  = null;   // { title, text }
let fileText    = null;

// ── Model selector ───────────────────────────────────────────────────────
document.querySelectorAll('.model-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeModel = btn.dataset.model;
  });
});

// ── Tabs ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    document.getElementById('tab-' + activeTab).classList.add('active');
    hideResult(); hideError('analyseError');
  });
});

// ── Clear ────────────────────────────────────────────────────────────────
function clearAll() {
  document.getElementById('newsText').value = '';
  urlFetched = null; fileText = null;
  document.getElementById('urlInput').value = '';
  document.getElementById('urlMeta').style.display = 'none';
  document.getElementById('filePreview').style.display = 'none';
  document.getElementById('fileInput').value = '';
  hideResult(); hideError('analyseError');
}

// ── URL fetch ────────────────────────────────────────────────────────────
async function fetchURL() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showError('urlError', 'Please enter a URL.'); return; }
  hideError('urlError');
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true; btn.textContent = '⏳';

  try {
    const res  = await fetch('/fetch-url', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok || data.error) { showError('urlError', data.error || 'Fetch failed.'); return; }

    urlFetched = { title: data.title, text: data.text };
    document.getElementById('urlTitle').textContent  = data.title || 'Article fetched';
    document.getElementById('urlStats').textContent  = `${url.slice(0,60)}${url.length>60?'…':''} · ${data.word_count.toLocaleString()} words`;
    document.getElementById('urlPreview').textContent = data.preview;
    document.getElementById('urlMeta').style.display = 'block';
  } catch(e) {
    showError('urlError', 'Network error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '⬇ Fetch';
  }
}

function togglePreview() {
  const el   = document.getElementById('urlPreview');
  const span = document.querySelector('.toggle-preview');
  const open = el.style.display === 'block';
  el.style.display   = open ? 'none' : 'block';
  span.textContent   = open ? '▶ Show preview' : '▼ Hide preview';
}

// ── File reader ──────────────────────────────────────────────────────────
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fileText = ev.target.result;
    const prev = document.getElementById('filePreview');
    prev.textContent = fileText.slice(0, 600) + (fileText.length > 600 ? '…' : '');
    prev.style.display = 'block';
  };
  reader.readAsText(file);
}

// ── Main analyse ─────────────────────────────────────────────────────────
async function analyse() {
  hideError('analyseError'); hideResult();

  let text = '';
  if (activeTab === 'paste') text = document.getElementById('newsText').value.trim();
  else if (activeTab === 'url') text = urlFetched ? urlFetched.text : '';
  else if (activeTab === 'file') text = fileText || '';

  if (!text) {
    showError('analyseError',
      activeTab === 'url'  ? 'Please fetch a URL first.' :
      activeTab === 'file' ? 'Please upload a .txt file first.' :
      'Please enter some text.'
    ); return;
  }

  setLoading(true);
  try {
    const res  = await fetch('/predict', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, model: activeModel }),
    });
    const data = await res.json();
    if (!res.ok || data.error) { showError('analyseError', data.error); return; }
    renderResult(data);
  } catch(e) {
    showError('analyseError', 'Network error: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ── Render result ────────────────────────────────────────────────────────
function renderResult(d) {
  const isFake = d.prediction === 'FAKE';

  // Verdict
  document.getElementById('verdictBanner').innerHTML =
    `<div class="${isFake ? 'verdict-fake' : 'verdict-real'}" style="margin-bottom:14px">
      ${isFake ? '🚨' : '✅'} &nbsp;${d.prediction === 'FAKE' ? 'FAKE NEWS' : 'CREDIBLE NEWS'}
      &nbsp;|&nbsp; ${d.confidence}% Confidence
    </div>`;

  // Probabilities
  document.getElementById('probRow').innerHTML = `
    <div class="prob-card">
      <div class="prob-value fake">${d.prob_fake}%</div>
      <div class="prob-label">FAKE probability</div>
      <div class="progress-bar"><div class="progress-fill fake" style="width:${d.prob_fake}%"></div></div>
    </div>
    <div class="prob-card">
      <div class="prob-value real">${d.prob_real}%</div>
      <div class="prob-label">REAL probability</div>
      <div class="progress-bar"><div class="progress-fill real" style="width:${d.prob_real}%"></div></div>
    </div>`;

  // Word chart
  const maxAbs = Math.max(...d.top_words.map(w => Math.abs(w.score)));
  const chart  = d.top_words.map((w, i) => {
    const pct = maxAbs > 0 ? (Math.abs(w.score) / maxAbs * 100).toFixed(1) : 0;
    return `<div class="word-bar-row" style="animation-delay:${i*0.04}s">
      <span class="word-label">${escHtml(w.word)}</span>
      <div class="word-bar-track">
        <div class="word-bar-fill ${w.direction.toLowerCase()}" style="width:${pct}%"></div>
      </div>
      <span class="word-direction ${w.direction.toLowerCase()}">${w.direction}</span>
    </div>`;
  }).join('');
  document.getElementById('wordChart').innerHTML = chart;

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  loadHistory();
}

// ── History ───────────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const res  = await fetch('/history');
    const data = await res.json();
    const el   = document.getElementById('historyList');
    if (!data.length) { el.innerHTML = '<div class="history-empty">No predictions yet.</div>'; return; }
    el.innerHTML = data.slice(0, 20).map(h => `
      <div class="history-row">
        <span class="h-text">${escHtml(h.text_preview)}</span>
        <span class="h-badge ${h.prediction.toLowerCase()}">${h.prediction}</span>
        <span class="h-conf">${h.confidence}%</span>
      </div>`).join('');
  } catch(e) { /* silent */ }
}

async function clearHistoryAll() {
  await fetch('/history', { method: 'DELETE' });
  loadHistory();
}

function toggleHistory() {
  const el  = document.getElementById('historyContent');
  const chv = document.getElementById('histChevron');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  chv.classList.toggle('open', !open);
  if (!open) loadHistory();
}

// ── Helpers ───────────────────────────────────────────────────────────────
function setLoading(on) {
  document.getElementById('analyseBtn').disabled = on;
  document.getElementById('btnText').style.display  = on ? 'none' : 'inline';
  document.getElementById('spinner').style.display  = on ? 'block' : 'none';
}
function hideResult() { document.getElementById('result').style.display = 'none'; }
function showError(id, msg) { const el = document.getElementById(id); el.textContent = '⚠ ' + msg; el.style.display = 'block'; }
function hideError(id)      { document.getElementById(id).style.display = 'none'; }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
